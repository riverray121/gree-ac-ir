esphome:
  name: ir-monitor
  friendly_name: IR Monitor

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.8.7
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1

# Diagnostic build: RMT receivers on both candidate pins, each dumping every
# burst into its own text sensor, plus the raw level of each pin.
remote_receiver:
  - id: rx14
    pin:
      number: GPIO14
      inverted: true
      mode:
        input: true
        pullup: true
    rmt_symbols: 240
    idle: 25ms
    dump:
      - raw
    on_raw:
      then:
        - lambda: |-
            static uint32_t n = 0; n++;
            char buf[100];
            snprintf(buf, sizeof(buf), "#%u %u symbols, first %d %d %d", (unsigned) n, (unsigned) x.size(),
                     x.size() > 0 ? x[0] : 0, x.size() > 1 ? x[1] : 0, x.size() > 2 ? x[2] : 0);
            id(raw14).publish_state(buf);
  - id: rx27
    pin:
      number: GPIO27
      inverted: true
      mode:
        input: true
        pullup: true
    rmt_symbols: 240
    idle: 25ms
    on_raw:
      then:
        - lambda: |-
            static uint32_t n = 0; n++;
            char buf[100];
            snprintf(buf, sizeof(buf), "#%u %u symbols, first %d %d %d", (unsigned) n, (unsigned) x.size(),
                     x.size() > 0 ? x[0] : 0, x.size() > 1 ? x[1] : 0, x.size() > 2 ? x[2] : 0);
            id(raw27).publish_state(buf);

text_sensor:
  - platform: template
    id: raw14
    name: "IR Burst P14"
  - platform: template
    id: raw27
    name: "IR Burst P27"

binary_sensor:
  - platform: template
    name: "P14 Low"
    lambda: return digitalRead(14) == LOW;
  - platform: template
    name: "P27 Low"
    lambda: return digitalRead(27) == LOW;

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
