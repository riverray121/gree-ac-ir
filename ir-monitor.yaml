esphome:
  name: ir-monitor
  friendly_name: IR Monitor

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fixed address outside the GL-MT3000 DHCP pool, next to the AC units
  # (.4 living room, .5 Elijah's bedroom, .6 Ram's bedroom).
  manual_ip:
    static_ip: 192.168.8.7
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1

external_components:
  - source: components

# TL1838 receiver: OUT on GPIO14, VCC on 3V3, GND on GND. The receiver's
# dome is placed beside the AC's own receiver window so it sees the same
# light the AC sees. IRrecv owns the pin (interrupt driven); no
# remote_receiver may claim it.
text_sensor:
  - platform: kelvinator_rx
    name: "IR RX Log"
    pin: 14

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
