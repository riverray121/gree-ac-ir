esphome:
  name: ac-ram-bedroom
  friendly_name: Ram's Bedroom AC

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fixed address outside the GL-MT3000 DHCP pool; HA's config entry
  # points at this IP. Living room is .4, Elijah's bedroom is .5.
  manual_ip:
    static_ip: 192.168.8.6
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1

external_components:
  - source: components

# IR LED driven by a KN2222A on GPIO4: GPIO4 -> 1k -> base, emitter to
# GND, 5V -> LED -> 22R -> collector.
# Frames go out through the RMT peripheral (hardware timing) with pulse
# lengths measured from the YAP2F remote at the AC's receiver, corrected
# for the receiver's own mark/space bias. The library only supplies the
# state bytes.
remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  rmt_symbols: 128

# Empty name: the climate entity inherits the device's friendly name, so
# the HA entity id is climate.ram_s_bedroom_ac.
climate:
  - platform: kelvinator_ac
    name: ""
    pin: 4
    transmitter_id: ir_tx
    timing:
      header_mark: 9000
      header_space: 4515
      bit_mark: 633
      one_space: 1687
      zero_space: 565
      gap: 20000
    # No transmit slot: IR does not reach the other rooms' receivers, so
    # this unit transmits as soon as a command arrives.
    tx_delay: 0ms
    tx_log:
      name: "IR TX Log"
