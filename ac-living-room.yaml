esphome:
  name: ac-living-room
  friendly_name: Living Room AC

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fixed address outside the GL-MT3000 DHCP pool; HA's config entry
  # points at this IP.
  manual_ip:
    static_ip: 192.168.8.4
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1

external_components:
  - source: components

# TL1838 IR receiver, OUT pin on GPIO14. Output idles high and pulls low
# on carrier, hence inverted + pullup. Kept for capturing codes; captured
# frames are archived in captured-codes.md.
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO14
    inverted: true
    mode:
      input: true
      pullup: true
  # AC frames exceed the 192-symbol default RMT buffer. The ESP32 has 512
  # RMT symbols TOTAL shared with any RMT transmitter.
  rmt_symbols: 384
  idle: 25ms
  dump:
    - raw
    - pronto

# Grove IR emitter SIG on GPIO4 (5V VCC). Frames go out through the RMT
# peripheral (hardware timing) with pulse lengths measured from the YAP2F
# remote at the AC's receiver; the library only supplies the state bytes.
# 64 TX symbols + 384 RX symbols stay inside the ESP32's 512 RMT total.
remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  rmt_symbols: 64

# Empty name: the climate entity inherits the device's friendly name, so
# the HA entity id is climate.living_room_ac.
climate:
  - platform: kelvinator_ac
    name: ""
    pin: 4
    transmitter_id: ir_tx
    timing:
      header_mark: 9000
      header_space: 4515
      bit_mark: 633
      one_space: 1687
      zero_space: 565
      gap: 20000
    tx_log:
      name: "IR TX Log"
