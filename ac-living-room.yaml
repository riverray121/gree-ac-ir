esphome:
  name: ac-living-room
  friendly_name: Living Room AC

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fixed address outside the GL-MT3000 DHCP pool; HA's config entry
  # points at this IP.
  manual_ip:
    static_ip: 192.168.8.4
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1

external_components:
  - source: components

# Grove IR emitter SIG on GPIO4 (5V VCC). Frames go out through the RMT
# peripheral (hardware timing) with pulse lengths measured from the YAP2F
# remote at the AC's receiver; the library only supplies the state bytes.
# 64 TX symbols + 384 RX symbols stay inside the ESP32's 512 RMT total.
remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  rmt_symbols: 64

# Empty name: the climate entity inherits the device's friendly name, so
# the HA entity id is climate.living_room_ac.
climate:
  - platform: kelvinator_ac
    name: ""
    pin: 4
    transmitter_id: ir_tx
    timing:
      header_mark: 9000
      header_space: 4515
      bit_mark: 633
      one_space: 1687
      zero_space: 565
      gap: 20000
    # Transmit slot. IR from one room reaches another room's AC, so units
    # transmitting together jam each other; a frame with its repeat lasts
    # ~1s on the air; 1.5s spacing leaves margin for API delivery jitter (Elijah's bedroom is 1500ms, Ram's bedroom is 3000ms).
    tx_delay: 0ms
    tx_log:
      name: "IR TX Log"
