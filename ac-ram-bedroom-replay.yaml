esphome:
  name: ac-ram-bedroom
  friendly_name: Ram's Bedroom AC

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fixed address outside the GL-MT3000 DHCP pool; HA's config entry
  # points at this IP. Living room is .4, Elijah's bedroom is .5.
  manual_ip:
    static_ip: 192.168.8.6
    gateway: 192.168.8.1
    subnet: 255.255.255.0
    dns1: 192.168.8.1

external_components:
  - source: components

# IR LED driven by a KN2222A on GPIO4: GPIO4 -> 1k -> base, emitter to
# GND, 5V -> LED -> 22R -> collector.
# Frames go out through the RMT peripheral (hardware timing) with pulse
# lengths measured from the YAP2F remote at the AC's receiver, corrected
# for the receiver's own mark/space bias. The library only supplies the
# state bytes.
remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  rmt_symbols: 128

# Empty name: the climate entity inherits the device's friendly name, so
# the HA entity id is climate.ram_s_bedroom_ac.
climate:
  - platform: kelvinator_ac
    id: ram_ac
    name: ""
    pin: 4
    transmitter_id: ir_tx
    timing:
      header_mark: 9000
      header_space: 4515
      bit_mark: 633
      one_space: 1687
      zero_space: 565
      gap: 20000
    # Transmit slot. IR from one room reaches another room's AC, so units
    # transmitting together jam each other; a frame with its repeat lasts
    # ~1s on the air; 1.5s spacing leaves margin for API delivery jitter (living room is 0, Elijah's bedroom is 1500ms).
    tx_delay: 3000ms
    tx_log:
      name: "IR TX Log"

# Diagnostic: replay the YAP2F remote's captured power-off frame byte for
# byte (captured-codes.md) through the same transmitter.
button:
  - platform: template
    name: "Replay remote off"
    on_press:
      - remote_transmitter.transmit_pronto:
          transmitter_id: ir_tx
          data: "0000 006D 0046 0000 0158 00B0 0017 0042 0016 0018 0015 0019 0016 0019 0016 0043 0016 0043 0016 0043 0017 0017 0016 0019 0015 0043 0016 0018 0016 0043 0016 0018 0016 0018 0016 0018 0016 0018 0017 0017 0016 0018 0016 0018 0016 0018 0016 0018 0017 0042 0016 0018 0015 0019 0016 0018 0016 0018 0016 0018 0016 0018 0017 0042 0016 0018 0016 0043 0016 0018 0016 0018 0016 0043 0016 0018 0016 0304 0016 0018 0017 0017 0016 0043 0016 0018 0016 0044 0015 0018 0016 0018 0016 0018 0016 0018 0016 0043 0016 0019 0015 0018 0016 0018 0017 0019 0015 0043 0016 0043 0016 0018 0016 0018 0016 0018 0016 001A 0014 0019 0015 0018 0015 0019 0017 0017 0016 0018 0016 0018 0015 0019 0016 0018 0016 0019 0015 0043 0016 0018 0016 0018 0015 03C2"
      - delay: 40ms
      - remote_transmitter.transmit_pronto:
          transmitter_id: ir_tx
          data: "0000 006D 0046 0000 0157 00B0 0016 0018 0016 0018 0016 0017 0017 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0019 0016 0019 0015 0019 0015 0018 0016 0018 0016 0019 0015 0018 0016 0019 0015 0019 0016 0017 0016 0019 0015 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0043 0016 0018 0017 0042 0016 0018 0016 0043 0016 0018 0016 0304 0016 0018 0016 0018 0016 0019 0014 0019 0016 0018 0016 0018 0016 0019 0015 0018 0016 0019 0016 0017 0016 0018 0016 0018 0017 0017 0016 0018 0016 0018 0016 0018 0016 0018 0016 001A 0015 0018 0016 0019 0015 0018 0016 0019 0015 0019 0015 0018 0016 0018 0016 0018 0015 001A 0016 0018 0016 0018 0016 0043 0016 0018 0016 0043 0016 03C2"

# Diagnostic: the emitter pin's actual level when idle. High while no frame
# is being sent means the pin drives the LEDs on; low with the LEDs still
# glowing means the transistor conducts on its own.
binary_sensor:
  - platform: template
    name: "IR pin high"
    lambda: return digitalRead(4) == HIGH;

number:
  - platform: template
    name: "Carrier kHz"
    min_value: 30
    max_value: 45
    step: 0.5
    initial_value: 38
    optimistic: true
    set_action:
      - lambda: id(ram_ac).set_carrier_hz((uint32_t) (x * 1000));
  - platform: template
    name: "Frame repeats"
    min_value: 1
    max_value: 6
    step: 1
    initial_value: 2
    optimistic: true
    set_action:
      - lambda: id(ram_ac).set_repeats((uint8_t) x);
  - platform: template
    name: "Mark bias us"
    min_value: -150
    max_value: 250
    step: 10
    initial_value: 0
    optimistic: true
    set_action:
      - lambda: id(ram_ac).set_mark_bias((int32_t) x);
  - platform: template
    name: "Half gap ms"
    min_value: 10
    max_value: 80
    step: 1
    initial_value: 40
    optimistic: true
    set_action:
      - lambda: id(ram_ac).set_half_gap((uint32_t) (x * 1000));
